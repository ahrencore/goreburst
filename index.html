<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover,user-scalable=no"/><meta name="theme-color" content="#16091f"/><title>Gore Burst — Carnival</title>
<style>
:root{--pink:#ff47ba;--violet:#9b42ff;--cyan:#55e5f4;--ink:#16091f;--glass:rgba(20,8,31,.91);color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;overflow:hidden;background:#090511;font-family:system-ui,-apple-system,'Trebuchet MS',sans-serif;color:#fff}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.app{position:relative;height:100dvh;width:100%;max-width:550px;margin:auto;overflow:hidden;background:#13081b;box-shadow:0 0 70px #000} .loading{position:absolute;inset:0;z-index:100;background:#110819 url('assets/loading.webp') no-repeat center center;background-size:contain;display:flex;justify-content:center;align-items:flex-end;padding:0 10% max(9vh,75px);transition:opacity .5s ease} .loading:before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 72%,rgba(7,2,15,.35))}.loading-info{z-index:1;width:100%;text-align:center;background:rgba(15,4,24,.7);border-radius:18px;padding:10px 13px;border:1px solid #fb57c9;backdrop-filter:blur(9px);box-shadow:0 0 24px #fa42b640}.loading-progress{height:9px;border-radius:10px;background:#382240;overflow:hidden;box-shadow:0 0 10px #ff5bcb}.loading-fill{height:100%;width:0;background:linear-gradient(90deg,#963eff,#ff4abb,#77faff);animation:load 3s linear forwards}.loading-caption{margin:9px 0 0;letter-spacing:.14em;text-transform:uppercase;font-size:10px;font-weight:800}.loading.hidden{opacity:0;pointer-events:none}@keyframes load{to{width:100%}}
.top{height:72px;position:absolute;inset:0 0 auto;z-index:10;background:linear-gradient(180deg,#300b3beF,#19091fee);border-bottom:2px solid #ff50b8;box-shadow:0 0 15px #ea39ce90;display:flex;gap:5px;align-items:center;padding:calc(env(safe-area-inset-top) + 3px) 7px 6px;justify-content:space-around}.pfp{width:47px;height:47px;border-radius:50%;background:linear-gradient(135deg,#411857,#ff71d3);border:2px solid #fd62cc;display:grid;place-items:center;font-size:25px;box-shadow:0 0 9px #f249b9;flex-shrink:0}.pill{min-width:0;display:flex;gap:3px;align-items:center;justify-content:center;background:#170d22;border:1px solid #e749bd;border-radius:20px;padding:6px 5px;box-shadow:inset 0 0 8px #ed37b52a;font-size:clamp(10px,2.8vw,13px);font-weight:900}.pill .symbol{font-size:17px}.mini{width:19px;height:19px;background:#57224e;border:1px solid #fe69c6;border-radius:50%;display:grid;place-items:center;font-weight:900;line-height:1; padding:0}.setting{border:0;background:transparent;font-size:23px;color:#ff71d3;padding:2px}
.scene{position:absolute;inset:72px 0 79px;isolation:isolate;overflow:hidden}.scene-art{position:absolute;inset:0;background-size:cover;background-position:center center;transition:opacity .28s}.scene:before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#10031e0d 0%,rgba(8,2,18,.10) 20%,rgba(8,3,21,.27) 85%,#10061871)}.scene-name{position:absolute;z-index:5;top:12px;left:50%;transform:translateX(-50%);border-radius:20px;background:#170b27d6;border:1px solid #db56deaa;box-shadow:0 0 12px #a934dd66;font-size:10px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;white-space:nowrap;padding:7px 13px}.path{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible;pointer-events:none}.path path{fill:none;stroke:#fe53d9;stroke-width:1.2;stroke-linecap:round;filter:drop-shadow(0 0 1px #ff69d5);stroke-dasharray:2 1.4}.nodes{position:absolute;inset:0;z-index:3}.node{position:absolute;transform:translate(-50%,-50%);width:clamp(52px,15vw,74px);height:clamp(42px,10vw,54px);border-radius:50%;background:radial-gradient(ellipse at 50% 10%,#4d195f,#17091d 80%);border:2px solid #fa66e8;box-shadow:0 0 6px #ff4dbc,0 0 15px #ee43ce66,inset 0 2px 12px #a034be77;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:1000;text-shadow:0 0 5px #ff62b9}.node .stars{position:absolute;top:88%;font-size:13px;letter-spacing:-2px;white-space:nowrap;color:#ffd25c;text-shadow:0 0 5px #ff9d24}.node.locked{border-color:#88628f;box-shadow:0 0 6px #9c5ca74a;color:#bfa4ca}.node.active{background:radial-gradient(ellipse at 50% 20%,#a32b7c,#2a0b38 80%);border-color:#fff1ff;box-shadow:0 0 9px #fff,0 0 26px #ff36c3;animation:pulse 1.9s ease-in-out infinite}.node.active:after{content:'◆';position:absolute;bottom:115%;color:#ff90ed;text-shadow:0 0 10px #fff;font-size:19px}@keyframes pulse{50%{box-shadow:0 0 6px white,0 0 35px #f42dcd}} .scene-controls{z-index:6;position:absolute;left:8px;right:8px;bottom:9px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.scene-controls button{pointer-events:auto;background:#1d0a2dea;border:1px solid #f84ad6;border-radius:20px;padding:9px 13px;box-shadow:0 0 9px #e33aaf9c;font-weight:900;font-size:12px}.scene-controls span{background:#10051db3;border-radius:18px;padding:8px;font-size:11px;letter-spacing:.06em}.bottom{height:79px;position:absolute;bottom:0;left:0;right:0;z-index:12;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#10071bed;border-top:2px solid #f552c8;box-shadow:0 0 22px #f445c269;padding-bottom:env(safe-area-inset-bottom)}.tab{background:none;border:0;border-right:1px solid #86315c77;display:grid;gap:1px;place-content:center;justify-items:center;min-width:0;font-weight:900;font-size:clamp(10px,2.6vw,13px);text-transform:uppercase}.tab .ico{font-size:28px;filter:drop-shadow(0 0 3px #9e4aa6)}.tab.active{background:linear-gradient(135deg,#731658,#250a36);color:#fff;border:2px solid #ff62d3;box-shadow:inset 0 0 16px #e92c9b,0 0 12px #d82e9b}.tab.active .ico{filter:drop-shadow(0 0 8px #ff66d4)}
.overlay{position:absolute;inset:0;z-index:30;background:#05030cbd;backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:20px}.overlay[hidden]{display:none}.modal{width:100%;max-width:350px;border:2px solid #ff6cdd;border-radius:23px;background:linear-gradient(135deg,#34123d,#16091f);box-shadow:0 0 30px #e92ea386, inset 0 0 24px #851a7790;text-align:center;padding:28px 18px}.modal .art{font-size:48px}.modal h2{font-size:25px;margin:6px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:#ffafe9}.modal p{line-height:1.5;color:#efcfef}.close{border:1px solid #ff98e3;background:#651552;padding:12px 28px;border-radius:22px;font-weight:900;box-shadow:0 0 12px #f84fba;margin-top:8px}.hidden-page{position:absolute;inset:72px 0 79px;z-index:8;background:linear-gradient(130deg,#1b0a26,#341038,#0a081a);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px}.hidden-page[hidden]{display:none}.hidden-page h1{font-size:26px;color:#ff80e4}.hidden-page .art{font-size:65px}.hint{font-size:12px;color:#d6afd1;max-width:320px;line-height:1.6}@media(max-height:670px){.top{height:62px}.scene,.hidden-page{top:62px;bottom:68px}.bottom{height:68px}.pill{padding:3px}.pfp{width:39px;height:39px}.tab .ico{font-size:23px}}
</style></head><body><main class="app" id="app">
<section class="loading" id="loading"><div class="loading-info"><div class="loading-progress"><div class="loading-fill"></div></div><p class="loading-caption">Preparing the freakshow...</p></div></section>
<header class="top"><button class="pfp" aria-label="Profile" data-popup="Profile">👤</button><div class="pill"><span class="symbol">❤️</span><span>5/5</span><button class="mini" data-popup="Lives" aria-label="More lives">+</button></div><div class="pill"><span class="symbol">🪙</span><span>1,250</span><button class="mini" data-popup="Coins" aria-label="More coins">+</button></div><div class="pill"><span class="symbol">💎</span><span>320</span></div><button class="setting" aria-label="Settings" data-popup="Settings">⚙</button></header>
<section class="scene" id="scene"><div class="scene-art" id="art"></div><div class="scene-name" id="sceneName"></div><svg class="path" id="route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path id="routePath"></path></svg><div class="nodes" id="nodes"></div><div class="scene-controls"><button id="prev" aria-label="Previous 7 levels">‹ Previous</button><span id="range"></span><button id="next" aria-label="Next 7 levels">Next ›</button></div></section>
<section class="hidden-page" id="other" hidden><div class="art" id="pageIcon"></div><h1 id="pageTitle"></h1><p>Coming soon. We’ll build this section after the Play screen.</p></section>
<nav class="bottom" aria-label="Main navigation"><button class="tab active" data-tab="Play"><span class="ico">🎪</span><span>Play</span></button><button class="tab" data-tab="Events"><span class="ico">🗓</span><span>Events</span></button><button class="tab" data-tab="Collectibles"><span class="ico">🧸</span><span>Collectibles</span></button><button class="tab" data-tab="Shop"><span class="ico">🛒</span><span>Shop</span></button></nav>
<div class="overlay" id="popup" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="art" id="modalArt">🎟️</div><h2 id="modalTitle">Coming Soon</h2><p id="modalDesc">This attraction isn't open yet.</p><button class="close" id="dismiss">Got it!</button></div></div>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let page=0,tab='Play';let loading=true;const sceneNames=['Prize Lane','Midway Games','Freakshow District'];const positionSets=[[[50,83],[68,72],[40,63],[64,54],[38,44],[61,34],[49,23]],[[49,83],[35,72],[62,62],[41,53],[64,43],[40,32],[56,22]],[[50,83],[66,73],[39,62],[63,53],[36,43],[59,32],[49,22]]];const starsFor=n=>n<4?3:n<7?2:n%5===0?3:1;function render(){const sceneIndex=page%3;const start=page*7+1;const pts=positionSets[sceneIndex];$('art').style.backgroundImage=`url(assets/scene${sceneIndex+1}.webp)`;$('sceneName').textContent=sceneNames[sceneIndex];$('range').textContent=`Levels ${start}–${start+6}`;$('prev').disabled=page===0;$('prev').style.opacity=page===0?'.4':'1';let d=pts.map((p,i)=>`${i?'L':'M'} ${p[0]} ${p[1]}`).join(' ');$('routePath').setAttribute('d',d);$('nodes').replaceChildren();pts.forEach(([x,y],i)=>{const n=start+i;const btn=document.createElement('button');btn.className='node '+(i===0?'active':(i>3?'locked':''));btn.style.left=x+'%';btn.style.top=y+'%';btn.setAttribute('aria-label',`Level ${n}`);btn.innerHTML=`<span>${n}</span><span class="stars">${i<=3?'★'.repeat(starsFor(n)):'🔒'}</span>`;btn.addEventListener('click',()=>showPopup(`Level ${n}`,'Coming Soon','Gameplay boards will be connected to this level later.'));$('nodes').append(btn)})}function showPopup(title,subtitle,desc){$('modalTitle').textContent=subtitle;$('modalDesc').textContent=title+': '+desc;$('modalArt').textContent='🎟️';$('popup').hidden=false;$('dismiss').focus()}function hidePopup(){$('popup').hidden=true}function setTab(next){tab=next;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('other').hidden=tab==='Play';$('scene').hidden=tab!=='Play';if(tab!=='Play'){$('pageIcon').textContent=({Events:'🎟️',Collectibles:'🧸',Shop:'🛍️'})[tab];$('pageTitle').textContent=tab}}$('next').addEventListener('click',()=>{page++;render()});$('prev').addEventListener('click',()=>{page=Math.max(0,page-1);render()});document.querySelectorAll('[data-popup]').forEach(b=>b.addEventListener('click',()=>showPopup(b.dataset.popup,'Coming Soon','This feature is planned for a later step.')));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));$('dismiss').addEventListener('click',hidePopup);$('popup').addEventListener('click',e=>{if(e.target===$('popup'))hidePopup()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hidePopup()});let sx=0,sy=0;$('scene').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});$('scene').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.4){page=Math.max(0,page+(dx<0?1:-1));render()}},{passive:true});render();setTimeout(()=>{$('loading').classList.add('hidden');setTimeout(()=>{$('loading').hidden=true;loading=false},550)},3000)})();
</script></body></html>
